server:
  port: 8080

spring:
  application:
    name: sky-take-out
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sky:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:sky-admin-secret-key-change-me-32-bytes-min}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET:sky-user-secret-key-change-me-32-bytes-min}
    user-ttl: 7200000
    user-token-name: authentication
  upload:
    dir: ./uploads