<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苍穹外卖 - 订单支付</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
    <div class="brand">苍穹外卖</div>
    <div class="user-box"><span>模拟支付</span></div>
</header>

<main>
    <section class="pay-card">
        <h2>订单支付</h2>
        <p class="hint">这是模拟支付页面，不接入真实微信支付。</p>
        <p>订单号：<strong id="orderNumber">-</strong></p>
        <p>收货人：<span id="consignee">-</span></p>
        <p class="pay-amount">应付金额：<strong id="amount">¥0.00</strong></p>
        <p>状态：<span id="status">加载中...</span></p>
        <button id="payBtn" class="primary">确认模拟支付</button>
        <a class="link" href="index.html?tab=order">稍后支付</a>
        <div id="message" class="error"></div>
    </section>
</main>
<script src="pay.js"></script>
</body>
</html>
